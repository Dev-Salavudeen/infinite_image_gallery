name: infinite_image_gallery
description: Pixabay image gallery with infinite scroll, downloads and favourites.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  gal: ^2.3.2
  hive_flutter: ^1.1.0
  http: ^1.2.2
  path_provider: ^2.1.5
  provider: ^6.1.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
