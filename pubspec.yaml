name: infinite_image_gallery
description: Pixabay image gallery with infinite scroll, downloads and favourites.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  gal: ^2.3.2
  hive_flutter: ^1.1.0
  http: ^1.2.2
  path_provider: ^2.1.5
  provider: ^6.1.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#161412"
  adaptive_icon_foreground: assets/branding/app_icon.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#0C0B0A"
    theme_color: "#8C6A4A"
